<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Forkcast – Pantry</title>

  <!-- Google Font (same as index) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Karma">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

  <style>
    /* Ensures fonts match the index page */
    body, h1, h2, h3, h4, h5, h6 {
      font-family: "Karma", sans-serif;
    }
  </style>
</head>

<body>

  <!-- Spacer to push content under fixed navbar -->
        <div style="height: 80px;"></div>

        <!-- NAVBAR (matching pantry page style) -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
            <div class="container" style="max-width: 1200px;">
                <span class="navbar-brand fs-2 fw-bold">Forkcast</span>

                <div class="ms-auto">
                    <a href="/" class="btn btn-link fw-bold text-decoration-underline">Home</a>
                    <a href="/pantry" class="btn btn-link">Pantry</a>
                    <a href="/logout" class="btn btn-link">Logout</a>
                </div>
            </div>
        </nav>
  <!-- MAIN CONTENT -->
  <div class="container" style="max-width: 1200px;">

    <h2 class="fw-bold mb-1">Your Saved Ingredients</h2>
    <p class="text-muted mb-4">Manage your pantry ingredients here.</p>

    <!-- ADD INGREDIENT CARD -->
    <div class="p-4 shadow-sm rounded bg-white mb-4">
      <form method="POST" action="/add_ingredient" class="row g-3">
        <div class="col-md-8">
          <input class="form-control" name="ingredient" placeholder="Add an ingredient..." required>
        </div>
        <div class="col-md-4">
          <button class="btn btn-primary w-100">Add Ingredient</button>
        </div>
      </form>
    </div>

    <!-- INGREDIENT LIST CARD -->
    <!-- INGREDIENT LIST CARD -->
<div class="p-4 shadow-sm rounded bg-white mb-5">
  <h4 class="mb-3">Ingredients</h4>

  {% if items %}
  <ul class="list-group">
    {% for item in items %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      {{ item['INGREDIENT'] }}
      <a href="/pantry/remove/{{ item['id'] }}" class="btn btn-danger btn-sm">Remove</a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="text-muted">No ingredients added yet.</p>
  {% endif %}
</div>

  </div>

</body>
</html>
