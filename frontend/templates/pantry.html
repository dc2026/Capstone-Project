<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Forkcast – Pantry</title>

        <!-- Google Font (same as index) -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css?family=Karma"
        />

        <!-- Bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <!-- w3schools -->
        <link
            rel="stylesheet"
            href="https://www.w3schools.com/w3css/5/w3.css"
        />

        <style>
            /* Ensures fonts match the index page */
            body,
            h1,
            h2,
            h3,
            h4,
            h5,
            h6 {
                font-family: "Karma", sans-serif;
            }
        </style>
    </head>

    <body>
        <!-- Spacer to push content under fixed navbar -->
        <div style="height: 80px"></div>

        <nav
            class="w3-sidebar w3-bar-block w3-card w3-top w3-xlarge w3-animate-left"
            style="
                display: none;
                z-index: 2;
                width: 40%;
                min-width: 300px;
                padding-top: 20px;
            "
            id="mySidebar"
        >
            <a
                href="javascript:void(0)"
                onclick="w3_close()"
                class="w3-bar-item w3-button"
                >Close Menu</a
            >
            <a href="/" onclick="w3_close()" class="w3-bar-item w3-button"
                >Home</a
            >
            <a onclick="w3_close()" class="w3-bar-item w3-button">Close</a>
        </nav>

        <!-- Top menu -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
            <div class="container" style="max-width: 1200px">
                <button
                    class="btn btn-outline-secondary me-3"
                    onclick="w3_open()"
                >
                    ☰
                </button>
                <span class="navbar-brand fs-2">Forkcast</span>
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <div class="container" style="max-width: 1200px">
            <h2 class="fw-bold mb-1">Your Saved Ingredients</h2>
            <p class="text-muted mb-4">Manage your pantry ingredients here.</p>

            <!-- ADD INGREDIENT CARD -->
            <div class="p-4 shadow-sm rounded bg-white mb-4">
                <form method="POST" action="/add_ingredient" class="row g-3">
                    <div class="col-md-8">
                        <input
                            class="form-control"
                            name="ingredient"
                            placeholder="Add an ingredient..."
                            required
                        />
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary w-100">
                            Add Ingredient
                        </button>
                    </div>
                </form>
            </div>

            <!-- INGREDIENT LIST CARD -->
<div class="p-4 shadow-sm rounded bg-white mb-5">
    <h4 class="mb-3">Ingredients</h4>

    <ul class="list-group" id="ingredient-list">
        {% if items %}
            {% for item in items %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ item.name }}
                <span class="badge bg-secondary rounded-pill">{{ item.category }}</span>
            </li>
            {% endfor %}
        {% else %}
            <li class="list-group-item text-muted">
                No ingredients yet. Add some above!
            </li>
        {% endif %}
    </ul>
</div>

        <script>
            // Script to open and close sidebar
            function w3_open() {
                document.getElementById("mySidebar").style.display = "block";
            }

            function w3_close() {
                document.getElementById("mySidebar").style.display = "none";
            }
        </script>
    </body>
</html>
