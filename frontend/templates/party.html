<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forkcast – Party Mode</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Karma">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body, h1, h2, h3, h4, h5, h6 { font-family: "Karma", sans-serif; }
    </style>
</head>
<body>
    <div style="height: 80px;"></div>
    
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
        <div class="container" style="max-width: 1200px;">
            <span class="navbar-brand fs-2 fw-bold">Forkcast</span>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/pantry">My Pantry</a>
                <a href="/party">Party Mode</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-3 pt-3" style="max-width: 600px">
        <div class="text-center py-4">
            <h1>🎉 Party Mode</h1>
            <p class="lead">Find recipes perfect for large groups!</p>
            <div class="alert alert-info">
                <small><strong>How it works:</strong> We prioritize recipes that work well for parties and large gatherings, like casseroles, stews, and batch-cooking dishes.</small>
            </div>
        </div>

        <div class="container mt-4">
            <form id="partyForm">
                <div class="mb-3">
                    <label for="ingredients" class="form-label">Ingredients</label>
                    <textarea name="ingredients" id="ingredients" class="form-control form-control-lg" rows="3"></textarea>
                </div>



                <div class="mb-3">
                    <label class="form-label">Dietary Restrictions (Optional)</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="vegetarian" id="vegetarian">
                        <label class="form-check-label" for="vegetarian">Vegetarian</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="vegan" id="vegan">
                        <label class="form-check-label" for="vegan">Vegan</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="gluten-free" id="gluten-free">
                        <label class="form-check-label" for="gluten-free">Gluten-Free</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Allergies (Optional)</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="nuts" id="nuts">
                        <label class="form-check-label" for="nuts">Nuts</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="dairy" id="dairy">
                        <label class="form-check-label" for="dairy">Dairy</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="shellfish" id="shellfish">
                        <label class="form-check-label" for="shellfish">Shellfish</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="eggs" id="eggs">
                        <label class="form-check-label" for="eggs">Eggs</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-lg">🎉 Generate Party Recipes</button>
                <button id="usePantry" type="button" class="btn btn-outline-success btn-lg">Use My Pantry</button>
            </form>
        </div>

        <div id="results" class="container mt-4"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const pantryBtn = document.getElementById("usePantry");
            if (pantryBtn) {
                pantryBtn.addEventListener("click", async () => {
                    try {
                        const res = await fetch("/get_my_pantry");
                        const data = await res.json();
                        if (data.status === "error") {
                            alert(data.message);
                            return;
                        }
                        if (!data.ingredients || data.ingredients.length === 0) {
                            alert("Your pantry is empty! Add ingredients in the Pantry page first.");
                            return;
                        }
                        document.getElementById("ingredients").value = data.ingredients.join(", ");
                    } catch (error) {
                        console.error("Error loading pantry:", error);
                        alert("Failed to load pantry ingredients");
                    }
                });
            }

            const partyForm = document.getElementById("partyForm");
            if (partyForm) {
                partyForm.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const form = e.target;
                    
                    const restrictions = [];
                    if (document.getElementById('vegetarian').checked) restrictions.push('vegetarian');
                    if (document.getElementById('vegan').checked) restrictions.push('vegan');
                    if (document.getElementById('gluten-free').checked) restrictions.push('gluten-free');
                    
                    const allergies = [];
                    if (document.getElementById('nuts').checked) allergies.push('nuts');
                    if (document.getElementById('dairy').checked) allergies.push('dairy');
                    if (document.getElementById('shellfish').checked) allergies.push('shellfish');
                    if (document.getElementById('eggs').checked) allergies.push('eggs');
                    
                    const data = {
                        ingredients: form.ingredients.value,
                        restrictions: restrictions,
                        allergies: allergies,
                        partyMode: true
                    };

                    try {
                        const res = await fetch("/submit", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(data),
                        });

                        const result = await res.json();
                        const resultsDiv = document.getElementById("results");

                        if (result.recipes && result.recipes.length > 0) {
                            let html = `<h3>🎉 Party Recipes:</h3>`;
                            result.recipes.forEach((recipe, index) => {
                                const modalId = `modal-${index}`;
                                
                                html += `
                                    <div class="card mb-3 border-success">
                                        <div class="card-body">
                                            <h5 class="card-title">${recipe.recipe} <span class="badge bg-success">Party Recipe</span></h5>
                                            <p class="card-text"><strong>Ingredients:</strong> ${recipe.ingredients}</p>
                                            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#${modalId}">
                                                Instructions
                                            </button>
                                            <p class="card-text"><small class="text-muted">Cook time: ${recipe.cook_time} min | Cuisine: ${recipe.cuisine}</small></p>
                                        </div>
                                    </div>

                                    <div class="modal fade" id="${modalId}" tabindex="-1">
                                        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h5 class="modal-title">${recipe.recipe} Instructions</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                </div>
                                                <div class="modal-body">
                                                    ${recipe.instructions}
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            });
                            resultsDiv.innerHTML = html;
                        } else {
                            resultsDiv.innerHTML = "<p>No matching recipes found.</p>";
                        }
                    } catch (error) {
                        console.error("Error submitting form:", error);
                        alert("Error submitting form. Check console for details.");
                    }
                });
            }
        });
    </script>
</body>
</html>
